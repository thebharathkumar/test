<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 446" width="1000" height="446" role="img" aria-label="Bharath Kumar Rajesh, AI Engineer, shown as a trace waterfall">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#151B26" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="85%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#7C6CF2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7C6CF2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C4BBFF"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0%" stop-color="#7C6CF2" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7C6CF2" stop-opacity="0.35"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1000" height="446" rx="16"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .meta { fill: #6B7689; font-size: 13px; }
      .span { fill: #C9D1DC; font-size: 14px; }
      .attr { fill: #FFFFFF; font-size: 12.5px; font-weight: 600; }
      .hdr  { fill: #4B5568; font-size: 11px; letter-spacing: 1.5px; }
      .fade { opacity: 0; animation: fade .6s ease-out forwards; }
      @keyframes fade { to { opacity: 1; } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1000" height="446" fill="#0B0E14"/>
    <rect width="1000" height="446" fill="url(#grid)"/>
    <rect width="1000" height="446" fill="url(#glow)"/>
    <rect width="1000" height="446" fill="url(#glow2)"/>

    <circle cx="46" cy="36" r="4" fill="#3FB950">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="46" cy="36" r="4" fill="none" stroke="#3FB950" stroke-width="1.5">
      <animate attributeName="r" values="4;11" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="60" y="40" class="mono meta">trace thebharathkumar  ·  service: ai-engineering  ·  status: <tspan fill="#3FB950">OK</tspan></text>
    <text x="960" y="40" text-anchor="end" class="mono meta">NYC  ·  open to relocation</text>

    <text x="40" y="108" class="sans fade" font-size="48" font-weight="800" fill="url(#name)" letter-spacing="-1" style="animation-delay:.05s">Bharath Kumar Rajesh</text>
    <text x="42" y="144" class="sans fade" font-size="19" fill="#A8B3C7" style="animation-delay:.25s">AI Engineer. Agents fail quietly. I build the tooling that makes them fail loudly.</text>

    <line x1="40" y1="172" x2="960" y2="172" stroke="#1F2633"/>
    <text x="40" y="196" class="mono hdr">SPAN</text>
    <text x="330" y="196" class="mono hdr">TIMELINE  /  ATTRIBUTES</text>

    <g>
      <circle cx="46" cy="226" r="4" fill="#7C6CF2"/>
      <text x="58" y="231" class="mono span">bharath.career</text>
      <rect x="330" y="214" width="0" height="24" rx="5" fill="#7C6CF2">
        <animate attributeName="width" from="0" to="630" begin="0.40s" dur="0.9s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
      </rect>
      <text x="342" y="231" class="mono attr fade" style="animation-delay:1.15s">agents · evals · observability · RAG</text>
    </g>
    <g>
      <circle cx="58" cy="262" r="4" fill="#3B82F6"/>
      <text x="70" y="267" class="mono span">edu.pace_ms_cs</text>
      <rect x="330" y="250" width="0" height="24" rx="5" fill="#3B82F6">
        <animate attributeName="width" from="0" to="230" begin="0.62s" dur="0.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
      </rect>
      <text x="342" y="267" class="mono attr fade" style="animation-delay:1.17s">M.S. CS · GPA 3.87</text>
    </g>
    <g>
      <circle cx="58" cy="298" r="4" fill="#10B981"/>
      <text x="70" y="303" class="mono span">prod.multi_agent</text>
      <rect x="400" y="286" width="0" height="24" rx="5" fill="#10B981">
        <animate attributeName="width" from="0" to="420" begin="0.84s" dur="0.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
      </rect>
      <text x="412" y="303" class="mono attr fade" style="animation-delay:1.39s">10K+ daily users · 99.5% uptime</text>
    </g>
    <g>
      <circle cx="58" cy="334" r="4" fill="#F59E0B"/>
      <text x="70" y="339" class="mono span">oss.faramesh</text>
      <rect x="530" y="322" width="0" height="24" rx="5" fill="#F59E0B">
        <animate attributeName="width" from="0" to="250" begin="1.06s" dur="0.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
      </rect>
      <text x="542" y="339" class="mono attr fade" style="fill:#141008;animation-delay:1.61s">Go · PR #33 merged</text>
    </g>
    <g>
      <circle cx="58" cy="370" r="4" fill="#EC4899"/>
      <text x="70" y="375" class="mono span">build.reliability</text>
      <rect x="580" y="358" width="0" height="24" rx="5" fill="#EC4899">
        <animate attributeName="width" from="0" to="380" begin="1.28s" dur="0.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
      </rect>
      <text x="592" y="375" class="mono attr fade" style="animation-delay:1.83s">loopcheck · claimtrace · downgrade</text>
    </g>
    <g>
      <circle cx="58" cy="406" r="4" fill="#22D3EE"/>
      <text x="70" y="411" class="mono span">lab.bioinformatics</text>
      <rect x="750" y="394" width="0" height="24" rx="5" fill="#22D3EE">
        <animate attributeName="width" from="0" to="210" begin="1.50s" dur="0.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
      </rect>
      <text x="762" y="411" class="mono attr fade" style="fill:#141008;animation-delay:2.05s">gcf-virome</text>
    </g>

    <path d="M46 232 V406 M46 262 H52 M46 298 H52 M46 334 H52 M46 370 H52 M46 406 H52" stroke="#2A3242" fill="none"/>

    <rect x="330" y="206" width="60" height="220" fill="url(#scan)" opacity="0">
      <animate attributeName="x" values="270;960" begin="2.6s" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" begin="2.6s" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.5" y="0.5" width="999" height="445" rx="15.5" fill="none" stroke="#1F2633"/>
</svg>
